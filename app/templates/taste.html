<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../static/frontend.js"></script>
    {% block javascript %}
        <script>
            var loggedIn = {{loggedIn}};
        </script>
    {% endblock %}
    <title>Taste</title>
</head>

<body class="bg-white text-black font-sans">
    <nav class="flex flex-row justify-between items-center h-16 w-full bg-white">
        <h1 class="basis-2/3 order-first ml-10 text-xl font-bold tracking-tight text-purple-800"><a href="/">YourAnimeSucks</a></h1>
        <ul id="navItem" class="basis-1/3 order-last flex flex-row justify-between h-full text-center items-center text-xl">
            <li class="flex items-center">
                <a href="/filter" class="px-4 py-2 text-black">Filter</a>
            </li>
            <li class="flex items-center">
                <a href="profile/{{username}}" class="px-4 py-2 text-black" id="pbutton">Profile</a>
            </li>
            <li class="flex items-center px-4">
                <a href="/signin" class="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition" id="login_button">Log in</a>
            </li>
        </ul>
    </nav>
    <h1>Taste</h1>
    <h2>Calculate your taste based on the mean popularity and rating of your filtered anime!</h2>

    <form class="" method="POST">
        <button class="rounded-2xl mx-auto min-w-full px-5 py-1 transition ease-in-out mt-2 border border-solid px-3 py-2 hover:-translate-y-1 hover:scale-110"type="calcTaste">Calculate Taste
        </button>
    </form>
    

</body>

</html>
