<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../static/frontend.js"></script>
    {% block javascript %}
        <script>
            var loggedIn = {{loggedIn}};
        </script>
    {% endblock %} 
    <title>Graph</title>
</head>

<body class="bg-white text-black font-sans">
  <nav class="flex flex-row justify-between items-center h-16 w-full bg-purple-800 text-white">
    <h1 class="basis-2/3 order-first ml-10 text-xl font-bold tracking-tight"><a href="/">YourAnimeSite</a></h1>
    <ul id="navItem" class="basis-1/3 order-last flex flex-row justify-between h-full text-center justify-center text-xl">
        <li class="size-full hover:bg-purple-500 flex text-center items-center justify-center">
           <a href="/filter">Filter</a>
        </li>
        <li class="size-full hover:bg-purple-500 flex text-center items-center justify-center">
            <a href="profile/{{username}}" id="pbutton">Profile</a>
        </li>
        <li class="size-full hover:bg-purple-500 flex text-center items-center justify-center">
            <a href="/signin" id="login_button">Log in</a>
        </li>
    </ul>
  </nav>    
  <div>
    <canvas id="myChart"></canvas>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>

  <script>
    const ctx = document.getElementById('myChart');

    new Chart(ctx, {
      type: '{{ __type__ }}',
      data: {
        labels: {{ __label_array__ | safe }},
        datasets: [{
          label: '{{ __label__ | safe }}',
          data: {{ __data_array__ | safe}},
          borderWidth: 1
        }]
      },
      options: {
        scales: {
          y: {
            beginAtZero: true
          }
        }
      }
    });
  </script>

</body>

</html>
