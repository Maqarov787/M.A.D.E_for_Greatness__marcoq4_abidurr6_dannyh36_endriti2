<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../static/frontend.js"></script>
    {% block javascript %}
        <script>
            var loggedIn = {{loggedIn}};
        </script>
    {% endblock %}
    <title>Graph</title>
</head>

<body class="bg-white text-black font-sans">
  <nav class="flex flex-row justify-between items-center h-16 w-full bg-purple-800 text-white">
    <h1 class="basis-2/3 order-first ml-10 text-xl font-bold tracking-tight"><a href="/">YourAnimeSucks</a></h1>
    <ul id="navItem" class="basis-1/3 order-last flex flex-row justify-between h-full text-center justify-center text-xl">
        <li class="size-full hover:bg-purple-500 flex text-center items-center justify-center">
           <a href="/filter">Filter</a>
        </li>
        <li class="size-full hover:bg-purple-500 flex text-center items-center justify-center">
            <a href="profile/{{username}}" id="pbutton">Profile</a>
        </li>
        <li class="size-full hover:bg-purple-500 flex text-center items-center justify-center">
            <a href="/signin" id="login_button">Log in</a>
        </li>
    </ul>
  </nav>
  <h1 class="font-bold text-purple-800 text-5xl underline px-7 pt-7">Graph</h1>
  <div class="flex flex-col items-center px-7 py-7 h-full" id="body">
    </br>
    <canvas id="myChart"></canvas>
    <form action="/taste" class="w-1/2">
      <button type = "submit" class="mt-3 w-full px-4 py-2 bg-purple-800 text-white rounded-md hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2"> Taste </button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>

  <script>
    const ctx = document.getElementById('myChart');

    new Chart(ctx, {
      type: '{{ __type__ }}',
      data: {
        labels: {{ __label_array__ | safe }},
        datasets: [{
          label: '{{ __label__ | safe }}',
          data: {{ __data_array__ | safe}},
          borderWidth: 1
        }]
      },
      options: {
        scales: {
          y: {
            beginAtZero: true
          }
        }
      }
    });
  </script>
</body>

</html>
