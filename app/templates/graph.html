<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../static/frontend.js"></script>
    {% block javascript %}
        <script>
            var loggedIn = {{loggedIn}};
        </script>
    {% endblock %}
    <title>Graph</title>
</head>

<body class="bg-white text-black font-sans">
  <nav class="flex flex-row justify-between items-center h-16 w-full bg-white text-purple-800">
    <h1 class="basis-2/3 order-first ml-10 text-xl font-bold tracking-tight text-purple-800"><a href="/">YourAnimeSucks</a></h1>
    <ul id="navItem" class="basis-1/3 order-last flex flex-row justify-between h-full text-center items-center text-xl">
        <li class="flex items-center">
            <a href="/filter" class="px-4 py-2 text-purple-800">Filter</a>
        </li>
        <li class="flex items-center">
            <a href="profile/{{username}}" class="px-4 py-2 text-purple-800" id="pbutton">Profile</a>
        </li>
        <li class="flex items-center px-4">
            <a href="/signin" class="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition" id="login_button">Log In</a>
        </li>
    </ul>
</nav>
  <h1 class="font-bold text-purple-800 text-5xl underline px-7 pt-7">Graph</h1>
  <div class="flex flex-col items-center px-7 py-7 h-full" id="body">
    </br>
    <canvas id="myChart"></canvas>

    <div class = "text-purple-800 rounded-2xl mx-auto min-w-full px-5 py-1 transition ease-in-out mt-2 border border-solid  px-3 py-2 hover:-translate-y-1 hover:scale-110 text-center">
      <h1>Average Ranking</h1>
      <h1>{{__mean_score__[0]}}</h1>
      <hr></hr>
      <h1>Average Rating</h1>
      <h1>{{__mean_score__[1]}}</h1>
    </div>
    
    <form action="/taste" class="w-1/2">
      <button type = "submit" class="mt-3 w-full px-4 py-2 bg-purple-800 text-white rounded-md hover:-translate-y-1 hover:scale-110 text-center" action ='tasty'> Taste </button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>

  <script>
    const ctx = document.getElementById('myChart');

    new Chart(ctx, {
      type: '{{ __type__ }}',
      data: {
        labels: {{ __label_array__ | safe }},
        datasets: [{
          label: '{{ __label__ | safe }}',
          data: {{ __data_array__ | safe}},
          borderWidth: 1
        }]
      },
      options: {
        scales: {
          y: {
            beginAtZero: true
          }
        }
      }
    });
  </script>
</body>

</html>
