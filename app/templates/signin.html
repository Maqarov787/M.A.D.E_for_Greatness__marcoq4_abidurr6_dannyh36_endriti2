<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../static/frontend.js"></script>
    {% block javascript %}
        <script>
            var loggedIn = {{loggedIn}};
        </script>
    {% endblock %} 
    <title>Sign In</title>
    <style>
        body {
            background: linear-gradient(135deg, #a78bfa 0%, #42096d 100%);
            height: 100%;
        }
    </style>
</head>

<body class="text-purple-800 font-sans">
    <nav class="flex flex-row justify-between items-center h-16 w-full bg-white text-purple-800">
        <h1 class="basis-2/3 order-first ml-10 text-xl font-bold tracking-tight text-purple-800"><a href="/">YourAnimeSucks</a></h1>
        <ul id="navItem" class="basis-1/3 order-last flex flex-row justify-between h-full text-center items-center text-xl">
            <li class="flex items-center">
                <a href="/filter" class="px-4 py-2 text-purple-800">Filter</a>
            </li>
            <li class="flex items-center">
                <a href="profile/{{username}}" class="px-4 py-2 text-purple-800" id="pbutton">Profile</a>
            </li>
            <li class="flex items-center px-4">
                <a href="/signin" class="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition" id="login_button">Log In</a>
            </li>
        </ul>
    </nav>
    <div class="grid place-content-center static space-y-8 py-10 max-w-xl m-auto my-20 rounded-3xl bg-white">

        <h1 class="text-5xl min-w-64 text-center font-semibold">Login</h1>

        {% if message %}
        <p class="bg-red-300 min-w-full p-2 text-red-700 text-center"> {{ message }}</p>
        {% endif %}

        <form method="POST">
            <label for="username">Username:</label>
            <br>
            <input class="border border-solid p-1 min-w-full rounded-md" type="text" id="username"
                name="username" placeholder="Username" required>
            <br><br>

            <label for="pw">Password:</label>
            <br>
            <input class="border border-solid p-1 min-w-full rounded-md" type="password" id="pw" name="pw"
                placeholder="Password" required>
            <br><br>

            <button
                class="rounded-2xl mx-auto min-w-full px-5 py-1 transition ease-in-out mt-2 border border-solid  px-3 py-2 hover:-translate-y-1 hover:scale-110"
                type="submit">Login</button>
        </form>

        <p class ="text-center">Don't have an account?</p>
        <form action="/signup">
            <button
                class="rounded-2xl mx-auto min-w-full px-5 py-1 transition ease-in-out mt-2 border border-solid  px-3 py-2 hover:-translate-y-1 hover:scale-110"
                type="submit">Sign Up</button>
        </form>
    </div>
</body>
</html>
