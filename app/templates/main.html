<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../static/frontend.js"></script>
    {% block javascript %}
        <script>
            var loggedIn = {{loggedIn}};
        </script>
    {% endblock %} 
    <title>YourAnimeSucks</title>
    <style>
        .hero-bg {
            background: linear-gradient(135deg, #a78bfa 0%, #42096d 100%);
        }

        body {
            height: 100-vh;
        }
        
    </style>
</head>

<body class="bg-white font-sans">
    <nav class="flex flex-row justify-between items-center h-16 w-full bg-white">
        <h1 class="basis-2/3 order-first ml-10 text-xl font-bold tracking-tight text-purple-800"><a href="/">YourAnimeSucks</a></h1>
        <ul id="navItem" class="basis-1/3 order-last flex flex-row justify-between h-full text-center items-center text-xl">
            <li class="flex items-center">
                <a href="/filter" class="px-4 py-2 text-black">Filter</a>
            </li>
            <li class="flex items-center">
                <a href="profile/{{username}}" class="px-4 py-2 text-black" id="pbutton">Profile</a>
            </li>
            <li class="flex items-center px-4">
                <a href="/signin" class="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition" id="login_button">Log in</a>
            </li>
        </ul>
    </nav>

    <div class="hero-bg">
        <div class="max-w-6xl mx-auto px-4 py-20">
            <div class="flex flex-col md:flex-row items-center justify-between">
                <div class="md:w-1/2 mb-10 md:mb-0">
                    <h1 class="text-4xl md:text-6xl font-bold text-white mb-6">
                        How Refined is Your Taste in Anime?
                    </h1>
                    <p class="text-lg text-white mb-8">
                        Filter, graph, and taste your preferences from a plethora of shows!
                    </p>
                    <a href="/filter" class="bg-white text-purple-600 px-8 py-3 rounded-lg font-semibold hover:bg-opacity-90 transition">
                        Start Filtering
                    </a>
                </div>
                <div class="md:w-1/2 flex justify-center">
                    <img src="../static/logo.png" class="w-80 h-80 object-contain">
                </div>
            </div>
        </div>
    </div>

    <div class="bg-purple-900">
        <div class="max-w-6xl mx-auto px-4 py-10">
            <div class="flex flex-col items-center space-y-6">
                <div class="text-center">
                    <h1 class="text-xl text-white font-bold">First Time? Sign Up Below!</h1>
                </div>
                <a href="/signup" 
                   class="bg-white text-purple-600 px-8 py-3 rounded-lg font-semibold hover:bg-opacity-90 transition">
                    Sign Up
                </a>
            </div>
        </div>
        <br></br>
    </div>
</body>
</html>
